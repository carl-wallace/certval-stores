# Dependency updates.
#
# The cargo entry is not housekeeping here: `certval_stores_webpki_root_certs` holds no
# certificates of its own, so its trust material moves only when the `webpki-root-certs`
# dependency moves. Without this, the crate whose entire advantage over `certval_stores_mozilla`
# is update cost had nothing that updated it.
#
# Weekly, on the same day as the provider refresh, so a maintainer reads all of the week's trust
# movement in one sitting rather than two.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      # One pull request for the week's churn. Grouping by family sounded tidier and produced one
      # grouped update beside four ungrouped ones, because a week's movement rarely lands inside
      # whichever family was named.
      cargo:
        patterns:
          - "*"
        # Two exceptions, each because merging it is a decision rather than an update.
        # `webpki-root-certs` IS the trust material of one provider, so a bump changes which roots
        # ship. `certval` is a git pin, so a bump changes the engine every store is built against.
        exclude-patterns:
          - "webpki-root-certs"
          - "certval"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"
