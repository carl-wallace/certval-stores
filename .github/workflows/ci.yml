name: certval-stores

on:
  pull_request:
  push:
    branches: main

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-Dwarnings"

# No MSRV matrix leg across the workspace, because the floor is not uniform: the
# provider crates declare certval's own 1.85 and `certval-store-gen` declares
# 1.86, which it needs honestly — it takes certval's `remote` feature, so reqwest
# pulls idna -> icu_* 2.2.0. A whole-workspace 1.85 job would fail on the
# generator alone. The providers are covered by the leg below.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: RustCrypto/actions/cargo-hack-install@master
      # Each provider builds with every environment individually and with none:
      # a crate whose material is behind a feature must still compile without it.
      - run: cargo hack build --each-feature --workspace

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: RustCrypto/actions/cargo-hack-install@master
      - run: cargo hack test --each-feature --workspace

  # --each-feature never combines features, so the legs that matter most for a
  # multi-environment provider run nowhere else: nipr+om_nipr in one build (where
  # an anchor or partial-path collision between two environments would surface),
  # fpki+fpki_legacy, and the core crate's composition test, which asks whether
  # every public provider can share one PkiEnvironment.
  test-combined:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-features

  # pittv3-wasm is the first consumer to take the trust material without the HTTP
  # client, and wasm is the configuration that cannot fall back: reqwest's wasm
  # backend has no Identity/Certificate and no timeout or add_root_certificate, so
  # `reqwest-client` does not compile there at all. This is the shape that consumer
  # builds, kept green on purpose.
  build-wasm-no-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build -p certval_stores_core --no-default-features --target wasm32-unknown-unknown
      - run: cargo build -p certval_stores_nipr --no-default-features --features nipr --target wasm32-unknown-unknown
      - run: cargo build -p certval_stores_eca --no-default-features --features eca --target wasm32-unknown-unknown
      - run: cargo build -p certval_stores_fpki --no-default-features --features fpki --target wasm32-unknown-unknown
      - run: cargo build -p certval_stores_pbdev --no-default-features --features dev --target wasm32-unknown-unknown
      - run: cargo build -p certval_stores_wcf --no-default-features --features wcf --target wasm32-unknown-unknown
      # msft_all alone: the other five environments are subsets of it over the same roots/,
      # so a wasm break in one is a wasm break in all of them.
      - run: cargo build -p certval_stores_msft --no-default-features --features msft_all --target wasm32-unknown-unknown
      - run: cargo build -p certval_stores_tpm --no-default-features --features tpm --target wasm32-unknown-unknown
      # No environment feature to name: this crate has one store and it is unconditional.
      - run: cargo build -p certval_stores_webpki_root_certs --no-default-features --target wasm32-unknown-unknown

  # The floor a consumer actually meets, which is certval's own 1.85 and what every provider
  # declares. What sets it is the library graph alone: certval-store-gen is a dev-dependency taken
  # with `default-features = false`, so it governs `cargo test` rather than a consumer's build, and
  # it declares 1.86 for itself.
  #
  # Two crates rather than all nine: nipr is the multi-environment shape and msft the only one with
  # a build script, so anything that breaks the floor breaks one of those.
  build-msrv-no-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0 # certval's floor, which the providers declare
      - run: cargo build -p certval_stores_nipr --no-default-features --features nipr
      - run: cargo build -p certval_stores_msft --no-default-features --features msft_all

  # Lints run on stable only. The pre-commit hook in each clone runs the same
  # commands so they fail before a push — an early warning, not a replacement.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: cargo fmt --all --check

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      # --all-features cannot catch warnings that only exist when a feature is
      # ABSENT (an import used solely by a gated path). certval_stores_nipr
      # defaults to no environments at all, so this default-feature run is the
      # one that covers that shape.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # The shapes between "nothing" and "everything", which neither clippy run above reaches.
  #
  # `--all-features` hides code that is dead without a feature, and the default run only covers
  # the default shape -- but a provider crate's build script asks for a *subset*: an InstallRoot
  # provider takes `fetch` and not `authroot`, and that combination is the one that had
  # `fetch_if_modified` sitting unused behind no gate. Every combination a real consumer can
  # request is built here, with warnings fatal, so dead code has nowhere left to hide.
  #
  # Only certval-store-gen: it is the one crate whose features compose, since a provider crate
  # names environments rather than capabilities and the wasm job already builds each of those.
  generator-feature-shapes:
    name: generator, each feature shape
    runs-on: ubuntu-latest
    strategy:
      # Every shape reports, rather than stopping at the first: knowing that three combinations
      # fail and which three is the whole value of a matrix here.
      fail-fast: false
      matrix:
        features:
          - "--no-default-features"
          - "--no-default-features --features fetch"
          - "--no-default-features --features cab"
          - "--no-default-features --features cab,fetch"
          - "--no-default-features --features authroot"
          - "--no-default-features --features tpm"
          - "--no-default-features --features cli"
          # The CLI offers a command per source, each gated on the feature that source needs, so
          # these two are where a command referring to a module that is not there shows up.
          - "--no-default-features --features cli,authroot"
          - "--no-default-features --features cli,tpm"
          - "--all-features"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - run: cargo clippy -p certval-store-gen --all-targets ${{ matrix.features }} -- -D warnings

  # The gate on what may enter the repository: every committed InstallRoot stream must
  # verify. This is what lets the build scripts stay tolerant — `build_check` reports a
  # stream it cannot parse as a skip rather than a failure, which is right for a consumer
  # building a published crate and would be wrong as the only line of defence. A stream
  # that reaches main has been checked here, so a consumer's build never has to decide
  # what to do about one that has not.
  #
  # Runs on every pull request. Almost all of it is local -- a stream carries its own signer's
  # certificate and the OCSP responses that settle its chain -- but this is the gate that also
  # asks Sectigo about the timestamp authority, which nothing staples and which is validated as
  # of today. So it needs egress to ocsp.sectigo.com, and a responder outage fails it: that is
  # the intended reading, since it is here rather than in a consumer's build that a status must
  # be determined. The drift check against DISA is a different case and belongs on a schedule.
  #
  # Population-independent by design — `verify` takes no --population, since a signature
  # covers a member and not one of the PKIs a stream happens to carry.
  inputs-verified:
    name: committed streams verify
    runs-on: ubuntu-latest
    env:
      RUST_LOG: info
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run -p certval-store-gen -- verify --stream certval_stores_*/inputs/*.ir4
