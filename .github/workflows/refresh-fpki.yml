# Refreshing the Federal PKI, on its own schedule.
#
# Separate from refresh.yml because the cadence is different and the material is. The InstallRoot
# streams and the Microsoft list move on a publisher's release schedule and are checked weekly; the
# FPKI mesh changes whenever any participant's cross-certificates change, which is continuous. A
# cross-certificate appearing is how a participant becomes reachable, so a week of not knowing is a
# week of paths that should have been found and were not.
#
# The store is built by walking the mesh from the committed anchor, Federal Common Policy CA G2,
# following the SIA caRepository and AIA caIssuers bundles each certificate names
# (`certval-store-gen fpki-crawl`). **The bundles are not
# signed.** That is what separates this provider from the others: the streams carry RFC 5934
# signatures and the Microsoft list a CMS one. Two things compensate: the walk starts at a
# committed anchor and the store keeps only what validates back to it, and every bundle is
# committed under `inputs/crawl/` as served, so the store can be regenerated from it and compared.
name: refresh fpki

on:
  schedule:
    # Daily. Offset from the other refresh jobs so two runs are not competing for a runner, and
    # off the hour because everyone schedules on the hour.
    - cron: "40 6 * * *"
  workflow_dispatch:

# contents to push the refresh branch, pull-requests to open the pull request. Opening one also
# needs the repository setting "Allow GitHub Actions to create and approve pull requests", which
# is on in this repository and certval-stores-mozilla only; with no required approvals in the rulesets,
# the approval half of that setting unlocks nothing. A pull request opened with this token starts
# no workflow: CI runs when the reviewer pushes the updated pinned constants.
permissions:
  contents: write
  pull-requests: write

# An explicit bash runs every step with pipefail, which the runner's default shell leaves off.
# The generator step pipes through tee, so a run that fails before writing anything fails its step
# instead of reaching the next one as a clean tree that reads as "nothing changed".
defaults:
  run:
    shell: bash

jobs:
  refresh-fpki:
    name: certval_stores_fpki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Walk the mesh and regenerate if it moved
        env:
          RUST_LOG: info
        run: |
          # Writes nothing when the walk reads exactly the bundles committed. A repository that
          # gives no answer is read from its committed bundle, or skipped when there is none; both
          # are raised as warnings, so a host that stays down is seen rather than silently aging
          # its copy in the store.
          cargo run -q -p certval-store-gen -- fpki-crawl 2>&1 | tee "$RUNNER_TEMP/fpki.log"
          grep -E 'using the copy from an earlier walk|no earlier copy, skipped|keeping the committed material' \
            "$RUNNER_TEMP/fpki.log" | while IFS= read -r line; do
              echo "::warning title=FPKI repository did not answer::${line}"
            done || true

      - name: Open a pull request if the material moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain certval_stores_fpki)" ]; then
            echo "nothing changed"
            exit 0
          fi
          # What moved, by content: the certificates added and removed and how many partial paths
          # changed. Computed before anything is committed so a failure fails the job rather than
          # leaving the description without it.
          moved="$(bash .github/scripts/store-diff.sh certval_stores_fpki)"
          cat > "$RUNNER_TEMP/body.md" <<EOF
          $moved

          The bundles are unsigned, so inputs/crawl/ records exactly what each repository served,
          and its diff names the repositories that changed. provenance/fpki/dropped.txt lists what
          the walk reached and the store leaves out: a certificate a repository still serves after
          it expired, or one with no path back to the anchor. Self-signed certificates the walk
          reaches are dropped by verifying the signature rather than by comparing issuer to
          subject, since the FPKI contains self-issued rollover certificates.

          CI is expected to fail. EXPECTED_INTERMEDIATES and EXPECTED_INTERMEDIATE_SET in
          certval_stores_fpki/tests/tests.rs pin the count and the certificate set that were last
          reviewed; the set digest is the half that catches one cross-certificate being swapped
          for another. The diff above names what moved; check it, update the constants on this
          branch, read their diff beside the one above, and merge:

              UPDATE_PINS=1 cargo test --workspace --all-features
              cargo fmt
              cargo test --workspace --all-features
              git diff -- '*/tests/*'

          Worth looking at first:

          - intermediates added: each is a cross-certificate, and each makes some participant
            reachable that was not
          - intermediates removed: a participant leaving the mesh, or a cross-certificate that
            expired (listed in provenance/fpki/dropped.txt)
          - the anchor is not expected to move. One root is the correct count for this PKI, not a
            gap; if Federal Common Policy CA G2 changes, that is a much larger event than a
            refresh and should not be merged from here.
          EOF
          bash .github/scripts/refresh-pr.sh refresh/certval_stores_fpki \
            "refresh certval_stores_fpki from the mesh ($(date -u +%Y-%m-%d))" \
            "$RUNNER_TEMP/body.md" certval_stores_fpki
