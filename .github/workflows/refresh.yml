# Refreshing the cabinet-sourced providers, on a schedule.
#
# These two crates commit material a publisher keeps changing, and nothing in a consumer's build
# fetches anything -- deliberately, since refreshing needs tpm_cab_verify, the authenticode fork
# and a pre-release ASN.1 stack whose patch entries do not travel with a git dependency. So the
# refresh lives here, where that patch table is, and runs whether or not anyone is building.
#
# The predecessor of tpm_roots rotted because keeping it current depended on someone remembering.
# A schedule does not forget; the review still happens, as a pull request.
#
# **A refresh PR is expected to arrive red.** Each crate pins its counts -- 357 roots carried, 47
# TPM roots, 42 dropped -- so when a publisher moves, the tests fail and name what changed. A
# person reads the certificate diff, updates the constants, and merges. That failure is the
# acknowledgement gate those constants exist for; a green one would mean nothing changed, and then
# no pull request is opened at all.
name: refresh providers

on:
  schedule:
    # Weekly. Microsoft's trust list changes about monthly and the TPM cabinet less often, but a
    # conditional GET costs 200 bytes, and what is worth catching quickly is not an addition --
    # it is a root acquiring a disallowed date, which is a distrust event.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# contents to push the refresh branch, pull-requests to open the pull request. Opening one also
# needs the repository setting "Allow GitHub Actions to create and approve pull requests", which
# is on in this repository and certval-stores-mozilla only; with no required approvals in the rulesets,
# the approval half of that setting unlocks nothing. A pull request opened with this token starts
# no workflow: CI runs when the reviewer pushes the updated pinned constants.
permissions:
  contents: write
  pull-requests: write

# An explicit bash runs every step with pipefail, which the runner's default shell leaves off.
# The generator step pipes through tee, so a run that fails before writing anything fails its step
# instead of reaching the next one as a clean tree that reads as "nothing changed".
defaults:
  run:
    shell: bash

jobs:
  # Two jobs rather than one: the TPM refresh re-fetches 2.9 MB and spends two minutes building a
  # path graph, and a timeout there must not hide a Microsoft trust list that moved.
  refresh:
    name: ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: certval_stores_msft
            command: authroot
          - crate: certval_stores_tpm
            command: tpm
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Refresh from the publisher
        env:
          RUST_LOG: info
        run: |
          cargo run -p certval-store-gen --features cli,authroot,tpm -- \
            ${{ matrix.command }} --crate-dir ${{ matrix.crate }} 2>&1 | tee refresh.log

      - name: Open a pull request if the material moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain ${{ matrix.crate }})" ]; then
            echo "nothing changed"
            exit 0
          fi
          # What moved in the store, by content, where the crate commits one (TPM does; the
          # Microsoft provider commits certificates, which the file list already names).
          moved="$(bash .github/scripts/store-diff.sh ${{ matrix.crate }} --features cli,authroot,tpm)"
          # The tool's own summary leads the description: it states what was carried, what was
          # dropped and what the publisher dated it, which is what a reviewer needs before opening
          # a single certificate. The rest is the review guidance.
          cat > "$RUNNER_TEMP/body.md" <<EOF
          $(grep -E 'rewritten|carried|dropped' refresh.log || true)

          $moved

          The material came from the publisher and was signature-checked before being written:
          the Microsoft trust list by its own CMS signature against the pinned anchor, the TPM
          cabinet by its Authenticode signature.

          CI is expected to fail. Each crate pins the counts its material had when it was last
          reviewed, and a digest over the certificate set, which is the half that catches a
          publisher swapping one certificate for another without changing how many there are.
          Check what moved, above and in the certificate files, update the constants on this
          branch, read their diff beside the one above, and merge:

              UPDATE_PINS=1 cargo test --workspace --all-features
              cargo fmt
              cargo test --workspace --all-features
              git diff -- '*/tests/*'

          Worth looking at first:

          - roots added or removed: each is a trust decision by the publisher
          - provenance/*/dropped.txt, where it exists: a count moving down means a publisher
            started including an issuer, up means a vendor's root stopped being carried
          - for the Microsoft list, roots that left because they acquired a disallowed date rather
            than because they expired
          EOF
          bash .github/scripts/refresh-pr.sh refresh/${{ matrix.crate }} \
            "refresh ${{ matrix.crate }} from the publisher ($(date -u +%Y-%m-%d))" \
            "$RUNNER_TEMP/body.md" ${{ matrix.crate }}

  # The InstallRoot streams, in two steps rather than one. Several environments can read the same
  # stream -- NIPR's production store and both interoperability stores all come from DoD.ir4 -- so
  # the publisher is asked once per stream and the generator run once per environment. This is the
  # table that used to live in each crate's build.rs, moved here when those went: a consumer builds
  # these crates without compiling certval or reqwest, and without a refresh it could not act on.
  refresh-streams:
    name: ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: certval_stores_nipr
            fetch: |
              gen refresh --url $BASE/DoD.ir4  --into certval_stores_nipr/inputs/DoD.ir4  --population dod
              gen refresh --url $BASE/JITC.ir4 --into certval_stores_nipr/inputs/JITC.ir4 --population dod
              fetch_bundle certval_stores_nipr/inputs DODINTEROPERABILITYROOTCA2_IB.p7c
              fetch_bundle certval_stores_nipr/inputs USDODCCEBINTEROPERABILITYROOTCA2_IB.p7c
            generate: |
              gen installroot --stream certval_stores_nipr/inputs/DoD.ir4 --population dod \
                --provider-dir certval_stores_nipr --env prod
              gen installroot --stream certval_stores_nipr/inputs/JITC.ir4 --population dod \
                --provider-dir certval_stores_nipr --env om
              gen installroot --stream certval_stores_nipr/inputs/DoD.ir4 --population dod \
                --provider-dir certval_stores_nipr --env interop \
                --extra-roots certval_stores_nipr/inputs/DoD_Interoperability_Root_CA_2.der \
                --extra-cas   certval_stores_nipr/inputs/DODINTEROPERABILITYROOTCA2_IB.p7c
              gen installroot --stream certval_stores_nipr/inputs/DoD.ir4 --population dod \
                --provider-dir certval_stores_nipr --env cceb_interop \
                --extra-roots certval_stores_nipr/inputs/US_DoD_CCEB_Interoperability_Root_CA_2.der \
                --extra-cas   certval_stores_nipr/inputs/USDODCCEBINTEROPERABILITYROOTCA2_IB.p7c
          - crate: certval_stores_eca
            fetch: |
              gen refresh --url $BASE/ECA.ir4 --into certval_stores_eca/inputs/ECA.ir4 --population eca
            generate: |
              gen installroot --stream certval_stores_eca/inputs/ECA.ir4 --population eca \
                --provider-dir certval_stores_eca --env prod
          - crate: certval_stores_wcf
            fetch: |
              gen refresh --url $BASE/WCF.ir4 --into certval_stores_wcf/inputs/WCF.ir4 --population wcf
            generate: |
              gen installroot --stream certval_stores_wcf/inputs/WCF.ir4 --population wcf \
                --provider-dir certval_stores_wcf --env prod
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Fetch the streams
        env:
          RUST_LOG: info
          BASE: https://crl.gds.disa.mil/pke/config
          ISSUEDBY: http://crl.disa.mil/issuedby
        run: |
          gen() { cargo run -q -p certval-store-gen --features cli -- "$@"; }
          # The interoperability environments also read each interoperability root's issued-by
          # bundle. A .p7c carries no publication date to compare, so a fetched bundle replaces
          # the committed copy when it parses as PKCS#7 and its bytes differ. A failed fetch or an
          # unparseable body keeps the committed copy and warns.
          fetch_bundle() {
            local tmp
            tmp="$(mktemp)"
            if curl -sSf --max-time 60 -o "$tmp" "$ISSUEDBY/$2" \
              && openssl pkcs7 -inform DER -in "$tmp" -print_certs -noout >/dev/null 2>&1; then
              cmp -s "$tmp" "$1/$2" || cp "$tmp" "$1/$2"
            else
              echo "::warning::could not fetch $ISSUEDBY/$2; keeping the committed copy"
            fi
            rm -f "$tmp"
          }
          ${{ matrix.fetch }}

      - name: Regenerate the environments that read a stream that moved
        env:
          RUST_LOG: info
        run: |
          if git diff --quiet ${{ matrix.crate }}/inputs; then
            echo "no stream moved; nothing to regenerate"
            exit 0
          fi
          gen() { cargo run -q -p certval-store-gen --features cli -- "$@"; }
          ${{ matrix.generate }}

      - name: Open a pull request if the material moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain ${{ matrix.crate }})" ]; then
            echo "nothing changed"
            exit 0
          fi
          # What moved in each store this crate regenerated, by content.
          moved="$(bash .github/scripts/store-diff.sh ${{ matrix.crate }} --features cli)"
          cat > "$RUNNER_TEMP/body.md" <<EOF
          $moved

          The stream was parsed as its population before it replaced anything, and a stream
          published older than the committed one is refused as a rollback rather than taken.

          CI is expected to fail. Each crate pins the counts its material had when it was last
          reviewed, so a change fails the tests and names itself. The diff above names what
          moved; check it, update the constants on this branch, read their diff beside the one
          above, and merge:

              UPDATE_PINS=1 cargo test --workspace --all-features
              cargo fmt
              cargo test --workspace --all-features
              git diff -- '*/tests/*'

          *_store_is_what_the_committed_stream_generates is the test that matters here: it
          regenerates from the committed .ir4 and compares certificate sets, so a store that
          drifted from its own input fails even when the counts still line up.
          EOF
          bash .github/scripts/refresh-pr.sh refresh/${{ matrix.crate }} \
            "refresh ${{ matrix.crate }} from the publisher ($(date -u +%Y-%m-%d))" \
            "$RUNNER_TEMP/body.md" ${{ matrix.crate }}
