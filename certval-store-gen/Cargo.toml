[package]
name = "certval-store-gen"
version = "0.1.0"
edition = "2021"
# 1.86 rather than certval's 1.85: reqwest's graph (url -> idna_adapter -> icu 2.2.0) sets it, and
# certval's revocation fetching is worth one release. Stable is twelve ahead of it.
rust-version = "1.86"
description = "Offline generator for certval CBOR trust-anchor and intermediate-CA stores (Web PKI, DoD TAMP, FPKI PKCS#7)"
license = "MIT OR Apache-2.0"
publish = false  # until the move to a public repo settles

[dependencies]
# certval provides the shared generation core: partial-path building and CBOR
# (BuffersAndPaths) serialization. The outputs are loaded verbatim by pittv3 and
# pittv3-wasm via TaSource::new_from_cbor / CertSource::new_from_cbor, so the store
# format is whatever certval emits.
#
# Taken by git rather than by path, and it has to be: every other member of this
# workspace takes certval from this same source, and cargo treats a path dep and a git
# dep as *different crates*. Mixing them would put two certvals in one graph, and the
# x509-cert types would stop matching across the boundary.
#
# Versions of the shared ASN.1 crates below are pinned to match certval's so the
# x509-cert / der / cms types unify across the crate boundary.
certval = { git = "https://github.com/carl-wallace/rust-pki.git", branch = "main", default-features = false, features = [
    "std",
    "webpki",
    "rsa",
    "eddsa",
    # Published bundles still carry SHA-1 signed roots; without this they cannot be verified and are
    # filed as intermediates.
    "sha1_sig",
    # certval as it lies: `remote` is its default, and taking it means the revocation ladder here
    # is the one certval ships rather than a second one assembled around it. It carries `revocation`
    # (the stapled OCSP an InstallRoot stream ships) and reqwest (what settles a chain nothing
    # staples -- the timestamp authority's). The cost is that reqwest's own graph sets the floor for
    # building this crate, and so for building a provider crate from source: rustc 1.86 rather than
    # certval's 1.85, one release apart and a dozen behind stable. Pinning a year-old icu to dodge
    # that is not worth the maintenance.
    "remote",
] }

# RFC 5934 / RFC 4073 syntax for the InstallRoot adapter. Taken by git for the same
# reason as certval: a path dep out of the workspace cannot be resolved by anyone who
# clones this repository.
rfc5934 = { git = "https://github.com/carl-wallace/rfc5934.git", branch = "main" }

x509-cert = { version = "0.3.0", default-features = false, features = ["pem"] }
# For reading the CertIDs of the OCSP responses a stream staples, so each one can be filed against
# the certificate it answers about. Version tracked to certval's so the types are the same ones it
# works with.
x509-ocsp = { version = "0.3.0-pre", default-features = false }
cms = "0.3.0-pre.2"
der = { version = "0.8.1", features = ["alloc", "derive", "oid", "pem"] }
const-oid = { version = "0.10.2", features = ["db"] }
# The store's own CBOR codec, for reading a store back and rewriting it. certval serializes with
# ciborium, so this reads exactly what it writes; the version matches certval's.
ciborium = { version = "0.2.2", default-features = false, features = ["std"] }

# certval's remote revocation checking is async, and a build script and a CLI are both synchronous
# callers, so one current-thread runtime is built to drive it. Taken unconditionally because the
# checks it serves are not optional; reqwest already puts tokio in the graph.
tokio = { version = "1", features = ["rt"] }

walkdir = "2.5"
csv = "1"
base64ct = { version = "1.8.3", features = ["alloc"] }
# Version tracked to certval's so the digest types are the same ones it works with.
sha2 = "0.11.0"
anyhow = "1"
log = "0.4"
# Behind `cli` so a build script depending on this crate for the library takes neither.
clap = { version = "4.5", features = ["derive"], optional = true }
env_logger = { version = "0.11", optional = true }
# Behind `fetch`, and synchronous: fetching a stream is one blocking GET from a build script, so
# ureq is the whole HTTP client this crate needs of its own. reqwest is in the graph regardless --
# certval's `remote` feature brings it for revocation checking -- so this is about the shape of the
# call rather than about keeping the stack out.
ureq = { version = "3", optional = true }
# Behind `cab`, for the two publishers that ship inside a Microsoft cabinet: the root program
# (`authrootstl.cab`) and the TPM vendor roots (`TrustedTpm.cab`). `cab` reads the container --
# including MSZIP, whose blocks cannot be decompressed independently -- and `tpm_cab_verify`
# checks the Authenticode signature over it against the Microsoft roots it carries, at the
# timestamped signing time. Taken by git for the same reason certval is: it takes certval from
# that same source, and a path or crates.io copy would put two certvals in one graph.
cab = { version = "0.6", optional = true }
tpm_cab_verify = { git = "https://github.com/carl-wallace/tpm_cab_verify.git", branch = "main", optional = true }
# Behind `authroot`: Microsoft addresses each root in its trust list by SHA-1 thumbprint, and
# checking that a served certificate matches the one the signed list asked for is that adapter's
# whole trust argument. Version tracked to certval's so the digest types are the same ones it
# works with.
sha1 = { version = "0.11.0", optional = true }

[features]
# On by default so `cargo run`/`cargo install` still build the binary unchanged. A
# consumer that wants only the generation core takes `default-features = false`.
default = ["cli"]
# `fetch` too: the CLI is the maintainer-facing tool, and refreshing or crawling is most of what
# a maintainer runs it for. A build script takes `fetch` alone and so takes neither clap nor
# env_logger.
cli = ["dep:clap", "dep:env_logger", "fetch"]
# Refreshing a committed generator input from the URL it was collected from. Off by default:
# a consumer generating from material already in hand needs no HTTP stack, and a provider
# crate's build script is the only caller that does.
fetch = ["dep:ureq"]
# Reading a signed Microsoft cabinet. Off by default and not implied by `fetch`: verification
# brings `tpm_cab_verify` and the `authenticode` fork, which a provider refreshing an InstallRoot
# stream has no use for. Only an adapter for a CAB-published source asks for it.
cab = ["dep:cab", "dep:tpm_cab_verify"]
# The Microsoft root program: a signed cabinet, a certificate trust list inside it, and one HTTP
# GET per root. `cab` to verify the cabinet, `fetch` for the ~562 certificate fetches, `sha1` for
# the thumbprint check that binds them to the list.
authroot = ["cab", "fetch", "dep:sha1"]
# The TPM vendor roots: one Authenticode-signed cabinet that *is* the material, rather than an
# index of it. `cab` to verify the cabinet -- route 1, where the cabinet vouches for its members --
# and `fetch` to pull it.
tpm = ["cab", "fetch"]

[[bin]]
name = "certval-store-gen"
required-features = ["cli"]

