[package]
name = "certval_stores_core"
version = "0.1.0-rc.1"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/carl-wallace/certval-stores"
description = "Composes certval_stores_* trust-store providers into a certval PkiEnvironment, a serialized store or a reqwest client"
keywords = ["x509", "pki", "trust-store", "certval", "tls"]
categories = ["cryptography"]
# What the build reads, plus the changelog: the sources and the README lib.rs takes its docs from.
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-APACHE", "LICENSE-MIT"]

[dependencies]
certval_stores_provider_core = { path = "../certval_stores_provider_core", version = "1.0.0-rc.1" }
log = "0.4.33"
# default-features = false deliberately: certval's defaults are ["remote", "webpki"],
# and `remote` pulls reqwest. Trust material needs neither, and taking the defaults
# would drag the HTTP stack in behind the back of the client features below,
# leaving nothing for a consumer to turn off. A provider that wants certval's webpki
# roots or its revocation support enables `certval/webpki` or `certval/remote` itself.
certval = { git = "https://github.com/carl-wallace/rust-pki.git", version = "0.2.0-pre", default-features = false, branch = "main" }

# Used by the conformance harness to read the partial paths serialized beside a
# store's buffers, which CertSource does not expose.
ciborium = { version = "0.2.2", default-features = false, features = ["std"], optional = true }
# Derives the serde shape of a store for `conformance::RawStore`; certval's own
# BuffersAndPaths is readonly, so it cannot be built or edited from out here.
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }
# `test-util` only, for `conformance::set_digest`. Never in a consumer's graph.
sha2 = { version = "0.11.0", optional = true }
# Without its default features, so that the client features below decide which TLS stack is
# compiled. The other defaults (HTTP/2, charset decoding, the system proxy) are kept.
reqwest = { version = "0.13.4", default-features = false, features = ["http2", "charset", "system-proxy"], optional = true }

[features]
default = ["reqwest-rustls"]
# The client features: `get_reqwest_client` and the constructor for one TLS stack each, and with
# them the HTTP stack: reqwest brings tokio, hyper, and url -> idna -> icu, most of this crate's
# dependency graph. Each compiles only its own TLS stack, so a consumer builds the one it calls.
# Turn both off (`default-features = false`) to use the providers without an HTTP client: a wasm
# or embedded consumer, or one bringing its own.
#
# rustls, with its default aws-lc crypto provider, for `get_reqwest_client_rustls`. On by default
# because it builds for every target, Android included. aws-lc is a C build, and the provider
# with a FIPS-validated configuration.
reqwest-rustls = ["dep:reqwest", "reqwest/rustls"]
# native-tls, for `get_reqwest_client_native`: the platform's TLS on macOS and iOS (Security
# framework), Linux (system OpenSSL) and Windows (SChannel). Not for Android, where native-tls
# would cross-compile OpenSSL; `get_reqwest_client_native` does not exist there.
reqwest-native = ["dep:reqwest", "reqwest/native-tls"]
# Conformance checks over the TrustStoreProvider contract, for provider crates
# to run from their own tests. Off by default so consumers do not carry them.
test-util = ["dep:ciborium", "dep:serde", "dep:sha2"]

# The provider crates depend on this one; depending back on them *for tests only*
# is what lets tests/composition.rs check the family as a whole. Cargo allows a
# cycle through dev-dependencies.
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
certval_stores_core = { path = ".", default-features = false, features = ["test-util"] }
certval_stores_eca = { path = "../certval_stores_eca", default-features = false, features = ["eca"] }
certval_stores_fpki = { path = "../certval_stores_fpki", default-features = false, features = ["fpki", "fpki_legacy"] }
certval_stores_msft = { path = "../certval_stores_msft", default-features = false, features = ["msft_all"] }
certval_stores_nipr = { path = "../certval_stores_nipr", default-features = false, features = ["nipr", "om_nipr"] }
certval_stores_pbdev = { path = "../certval_stores_pbdev", default-features = false, features = ["dev"] }
certval_stores_tpm = { path = "../certval_stores_tpm", default-features = false, features = ["tpm"] }
certval_stores_wcf = { path = "../certval_stores_wcf", default-features = false, features = ["wcf"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
