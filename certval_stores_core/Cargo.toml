[package]
name = "certval_stores_core"
version = "0.1.0"
edition = "2021"
description = "Provider contract and certval/reqwest plumbing shared by the certval_stores_* trust-store crates"

[dependencies]
log = { version = "0.4.33", features = ["std", "serde"] }
certval = { git = "https://github.com/carl-wallace/rust-pki.git", features = ["std"], branch = "main" }

# native-tls uses the OS-blessed crypto on macOS/iOS (Secure Transport), Linux
# (system OpenSSL), and Windows (SChannel). Android is the only target where
# native-tls drags in cross-compiled OpenSSL, so rustls is used there instead.
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.13.4", features = ["native-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.13.4", features = ["rustls"] }
