[package]
name = "certval_stores_core"
version = "0.1.0"
edition = "2021"
description = "Provider contract and certval/reqwest plumbing shared by the certval_stores_* trust-store crates"

[dependencies]
log = { version = "0.4.33", features = ["std", "serde"] }
certval = { git = "https://github.com/carl-wallace/rust-pki.git", features = ["std"], branch = "main" }

# Used by the conformance harness to read the partial paths serialized beside a
# store's buffers, which CertSource does not expose.
ciborium = { version = "0.2.2", default-features = false, features = ["std"], optional = true }

[features]
default = []
# Conformance checks over the TrustStoreProvider contract, for provider crates
# to run from their own tests. Off by default so consumers do not carry them.
test-util = ["dep:ciborium"]

# native-tls uses the OS-blessed crypto on macOS/iOS (Secure Transport), Linux
# (system OpenSSL), and Windows (SChannel). Android is the only target where
# native-tls drags in cross-compiled OpenSSL, so rustls is used there instead.
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.13.4", features = ["native-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.13.4", features = ["rustls"] }

# The provider crates depend on this one; depending back on them *for tests only*
# is what lets tests/composition.rs check the family as a whole. Cargo allows a
# cycle through dev-dependencies.
[dev-dependencies]
certval_stores_core = { path = ".", features = ["test-util"] }
certval_stores_fpki = { path = "../certval_stores_fpki", features = ["fpki", "fpki_legacy"] }
certval_stores_nipr = { path = "../certval_stores_nipr", features = ["nipr", "om_nipr"] }
certval_stores_pbdev = { path = "../certval_stores_pbdev", features = ["dev"] }
