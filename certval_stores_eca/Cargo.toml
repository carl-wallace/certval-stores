[package]
name = "certval_stores_eca"
version = "1.0.0-rc.1"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/carl-wallace/certval-stores"
description = "ECA (DoD External Certification Authority) trust store for certval"
keywords = ["x509", "pki", "trust-anchor", "dod", "certval"]
categories = ["cryptography"]
# What the build reads, plus the changelog: the sources, the README lib.rs takes its docs from, the
# embedded certificates and stores, and the provenance dates. inputs/ and tests/ are read only by
# the tests, as are the .der files under cas/, which are the generator's inputs for the .cbor beside
# them.
include = ["src/**", "README.md", "CHANGELOG.md", "roots/**/*.der", "cas/**/*.cbor", "provenance/**/collected.txt", "provenance/**/published.txt", "LICENSE-APACHE", "LICENSE-MIT"]

[dependencies]
certval_stores_provider_core = { path = "../certval_stores_provider_core", version = "1.0.0-rc.1" }

[features]
default = ["eca"]
# The ECA program as published today: ECA Root CA 4 and 5 plus the vendor CAs
# beneath them. The crate's only environment, so it is on by default — unlike
# certval_stores_nipr, where a consumer has to say which of two it wants.
eca = []

[dev-dependencies]
# The regeneration check that build.rs used to run: a dev-dependency so CI keeps it and no
# consumer compiles it. Default features off, which leaves out the CLI and `fetch` with its HTTP
# client: the test reads only the committed stream.
certval-store-gen = { path = "../certval-store-gen", default-features = false }
# default-features = false for the same reason as the core crate: certval's
# defaults pull reqwest, and a dev-dependency taking them puts the HTTP stack
# back into the test graph however core's client features are configured, so a
# --no-default-features test run would not build the shape it claims to.
certval = { git = "https://github.com/carl-wallace/rust-pki.git", default-features = false, features = ["std", "rsa"], branch = "main" }
certval_stores_core = { path = "../certval_stores_core", default-features = false, features = ["test-util"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
