[package]
name = "certval_stores_fpki"
version = "1.0.0-rc.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Federal PKI trust store for certval — anchored at the Federal Common Policy CA G2"
keywords = ["x509", "pki", "trust-anchor", "fpki", "certval"]
categories = ["cryptography"]
# What the build reads, plus the changelog: the sources, the README lib.rs takes its docs from, the
# embedded certificates and store, and the walk date. inputs/ and tests/ are read only by the tests.
include = ["src/**/*.rs", "README.md", "CHANGELOG.md", "roots/**/*.der", "cas/**/*.cbor", "provenance/**/collected.txt", "LICENSE-APACHE", "LICENSE-MIT"]

[dependencies]
certval_stores_provider_core = { path = "../certval_stores_provider_core", version = "1.0.0-rc.1" }

[dev-dependencies]
# The regeneration check: a dev-dependency so CI runs it and no consumer compiles it. Default
# features off, which leaves out the CLI and `fetch` with its HTTP client: the test reads only
# the committed walk.
certval-store-gen = { path = "../certval-store-gen", default-features = false }
certval_stores_core = { path = "../certval_stores_core", default-features = false, features = ["test-util"] }
# default-features = false for the same reason as the core crate: certval's
# defaults pull reqwest, and a dev-dependency taking them puts the HTTP stack
# back into the test graph however core's client features are configured, so a
# --no-default-features test run would not build the shape it claims to.
certval = { workspace = true, features = ["std", "rsa"] }

[features]
default = ["fpki"]
# The Federal PKI as published today: Federal Common Policy CA G2 plus the
# cross-certified mesh beneath it.
fpki = []
# The retired Federal Common Policy CA (G1). Anchors-only, no CA store; enable
# only to validate paths that predate the G2 migration.
fpki_legacy = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
