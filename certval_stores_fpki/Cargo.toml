[package]
name = "certval_stores_fpki"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "Federal PKI trust store for certval — anchored at the Federal Common Policy CA G2"

[dependencies]
certval_stores_core = { path = "../certval_stores_core", default-features = false }

[dev-dependencies]
certval_stores_core = { path = "../certval_stores_core", features = ["test-util"] }
certval = { git = "https://github.com/carl-wallace/rust-pki.git", features = ["std", "rsa"], branch = "main" }

[features]
default = ["fpki", "reqwest-client"]
# Forwards the core crate's client switch. Without this a consumer could not
# turn the HTTP stack off: features are additive, so this crate enabling the
# core default would re-enable it however the consumer configured core.
reqwest-client = ["certval_stores_core/reqwest-client"]
# The Federal PKI as published today: Federal Common Policy CA G2 plus the
# cross-certified mesh beneath it.
fpki = []
# The retired Federal Common Policy CA (G1). Anchors-only, no CA store; enable
# only to validate paths that predate the G2 migration.
fpki_legacy = []
