[package]
name = "certval_stores_msft"
version = "1.0.0-rc.1"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/carl-wallace/certval-stores"
description = "Microsoft root program trust stores for certval, split by the purposes the program grants"
keywords = ["x509", "pki", "trust-anchor", "microsoft", "certval"]
categories = ["cryptography"]
# What the build reads, plus the changelog: the sources, the README lib.rs takes its docs from,
# build.rs and the roots it checks, and the provenance dates. inputs/ and tests/ are read only by
# the tests.
include = ["src/**", "README.md", "CHANGELOG.md", "build.rs", "roots/**/*.der", "provenance/collected.txt", "provenance/published.txt", "LICENSE-APACHE", "LICENSE-MIT"]

[dependencies]
certval_stores_provider_core = { path = "../certval_stores_provider_core", version = "1.0.0-rc.1" }

[features]
# `msft_all` rather than nothing, because unlike certval_stores_nipr there is a sensible default
# here: every other environment is a subset of it, so a consumer who has not chosen gets the
# program rather than an arbitrary slice of it.
default = ["msft_all"]

# The six environments are views over one list, not six collections: every root comes from the
# same signed trust list, and what differs is the purposes Microsoft grants it. A root granted
# five purposes appears in five of these, and the certificate itself is stored once.
#
# Every root in the program, whatever it is trusted for.
msft_all = []
# Roots granted id-kp-serverAuth. The comparison store against `mozilla_tls` and certval's own
# webpki-roots: three programs answering the same question, which is worth being able to see.
msft_tls = []
# Roots granted id-kp-clientAuth.
msft_client_auth = []
# Roots granted id-kp-emailProtection.
msft_email = []
# Roots granted id-kp-codeSigning. No other provider in this family covers code signing, and no
# other root program publishes a set for it.
msft_code_signing = []
# Roots granted id-kp-timeStamping, which is what an Authenticode countersignature chains to.
msft_timestamping = []


[build-dependencies]
# The thumbprint check every build runs, consumer or not: each file in roots/ must hash to its own
# name. sha1 alone, deliberately -- it is on crates.io, needs no patch, and keeps the one check a
# consumer benefits from out of the heavy half below.
sha1 = "0.11.0"

[dev-dependencies]
# default-features = false for the same reason as the core crate: certval's defaults pull reqwest,
# and a dev-dependency taking them puts the HTTP stack back into the test graph however
# core's client features are configured.
certval = { version = "0.2.0-rc.1", default-features = false, features = [
    "std",
    "rsa",
    # A third of the program is signed with SHA-1 and two roots with MD2. Without this the tests
    # cannot even read what the crate ships.
    "sha1_sig",
] }
certval_stores_core = { path = "../certval_stores_core", default-features = false, features = [
    "test-util",
] }
# For the test that every file's name is the SHA-1 of its own contents, which is the same check
# the generator makes when admitting a certificate.
sha1 = "0.11.0"
x509-cert = { version = "0.3.0", default-features = false }
der = { version = "0.8.1", features = ["alloc"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
