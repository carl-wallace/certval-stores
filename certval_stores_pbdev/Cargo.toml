[package]
name = "certval_stores_pbdev"
version = "1.0.0-rc.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Development (Purebred dev) trust store for certval"
keywords = ["x509", "pki", "trust-anchor", "purebred", "certval"]
categories = ["cryptography"]
# What the build reads, plus the changelog: the sources, the README lib.rs takes its docs from, and
# the embedded certificates and stores. tests/ is read only by the tests, as are the .der files
# under cas/, which are the generator's inputs for the .cbor beside them.
include = ["src/**/*.rs", "README.md", "CHANGELOG.md", "roots/**/*.der", "cas/**/*.cbor", "LICENSE-APACHE", "LICENSE-MIT"]

[dependencies]
certval_stores_provider_core = { path = "../certval_stores_provider_core", version = "1.0.0-rc.1" }

[features]
default = ["dev"]
# Purebred development environment (DoD Engineering roots).
dev = []

[dev-dependencies]
# For the check that `src/roots_dev.rs` is what the generator writes from `roots/dev/`: a
# dev-dependency so CI runs it and no consumer compiles it.
certval-store-gen = { path = "../certval-store-gen", default-features = false }
# default-features = false for the same reason as the core crate: certval's
# defaults pull reqwest, and a dev-dependency taking them puts the HTTP stack
# back into the test graph however core's client features are configured, so a
# --no-default-features test run would not build the shape it claims to.
certval = { workspace = true, features = ["std", "rsa"] }
certval_stores_core = { path = "../certval_stores_core", default-features = false, features = ["test-util"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
