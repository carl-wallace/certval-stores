[package]
name = "certval_stores_pbdev"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/carl-wallace/certval-stores"
description = "Development (Purebred dev) trust store for certval"
# Only what the build reads: the sources, the README lib.rs takes its docs from, and the embedded
# certificates and stores. tests/ is read only by the tests, as are the .der files under cas/, which
# are the generator's inputs for the .cbor beside them.
include = ["src/**", "README.md", "roots/**/*.der", "cas/**/*.cbor", "LICENSE-APACHE", "LICENSE-MIT"]

[dependencies]
certval_stores_provider_core = { path = "../certval_stores_provider_core", version = "1.0.0" }

[features]
default = ["dev"]
# Purebred development environment (DoD Engineering roots).
dev = []

[dev-dependencies]
# For the check that `src/roots_dev.rs` is what the generator writes from `roots/dev/`: a
# dev-dependency so CI runs it and no consumer compiles it.
certval-store-gen = { path = "../certval-store-gen", default-features = false }
# default-features = false for the same reason as the core crate: certval's
# defaults pull reqwest, and a dev-dependency taking them puts the HTTP stack
# back into the test graph however `reqwest-client` is configured, so a
# --no-default-features test run would not build the shape it claims to.
certval = { git = "https://github.com/carl-wallace/rust-pki.git", default-features = false, features = ["std", "rsa"], branch = "main" }
certval_stores_core = { path = "../certval_stores_core", default-features = false, features = ["test-util"] }
