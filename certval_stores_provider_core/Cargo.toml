[package]
name = "certval_stores_provider_core"
version = "1.0.0-rc.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The StoreEntry type and TrustStoreProvider trait that certval_stores_* trust-store crates implement"
keywords = ["x509", "pki", "trust-store", "certval"]
categories = ["cryptography"]
# What the build reads, plus the changelog: the sources and the README lib.rs takes its docs from.
include = ["src/**/*.rs", "README.md", "CHANGELOG.md", "LICENSE-APACHE", "LICENSE-MIT"]

# No dependencies, on purpose: a provider crate depends on this one alone, so nothing a
# certval or reqwest release changes can force a new major version of the providers.
[dependencies]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
