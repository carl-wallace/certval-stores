[package]
name = "certval_stores_wcf"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/carl-wallace/certval-stores"
description = "DoD WCF PKI trust store for certval"
# Only what the build reads: the sources, the README lib.rs takes its docs from, the embedded
# certificates and stores, and the provenance dates. inputs/ and tests/ are read only by the tests,
# as are the .der files under cas/, which are the generator's inputs for the .cbor beside them.
include = ["src/**", "README.md", "roots/**/*.der", "cas/**/*.cbor", "provenance/**/collected.txt", "provenance/**/published.txt", "LICENSE-APACHE", "LICENSE-MIT"]

[dependencies]
certval_stores_core = { path = "../certval_stores_core", default-features = false }

[features]
default = ["wcf", "reqwest-client"]
# Forwards the core crate's client switch. Without this a consumer could not
# turn the HTTP stack off: features are additive, so this crate enabling the
# core default would re-enable it however the consumer configured core.
reqwest-client = ["certval_stores_core/reqwest-client"]
# The WCF PKI as published today: DoD WCF Root CA 1, the intermediate beneath it
# and the signing CAs beneath that. The crate's only environment, so it is on by
# default — as in certval_stores_eca, and unlike certval_stores_nipr, where a
# consumer has to say which of two it wants.
wcf = []

[dev-dependencies]
# The regeneration check that build.rs used to run: a dev-dependency so CI keeps it and no
# consumer compiles it. Default features off, which leaves out the CLI and `fetch` with its HTTP
# client: the test reads only the committed stream.
certval-store-gen = { path = "../certval-store-gen", default-features = false }
# default-features = false for the same reason as the core crate: certval's
# defaults pull reqwest, and a dev-dependency taking them puts the HTTP stack
# back into the test graph however `reqwest-client` is configured, so a
# --no-default-features test run would not build the shape it claims to.
certval = { git = "https://github.com/carl-wallace/rust-pki.git", default-features = false, features = ["std", "rsa"], branch = "main" }
certval_stores_core = { path = "../certval_stores_core", default-features = false, features = ["test-util"] }
